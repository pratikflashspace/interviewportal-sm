# Review region and pricing before creating these paid resources.
services:
  - type: web
    name: flashspace-careers
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt && python -m unittest discover -s tests
    startCommand: gunicorn 'backend.server:create_app()' --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120 --access-logfile /dev/null
    healthCheckPath: /api/health
    disk:
      name: flashspace-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_PATH
        value: /var/data/flashspace.sqlite3
      - key: OPENAI_API_KEY
        sync: false
      - key: CLICKUP_API_TOKEN
        sync: false
      - key: CLICKUP_FOLDER_ID
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_STT_MODEL
        value: gpt-4o-mini-transcribe
      - key: OPENAI_TTS_MODEL
        value: gpt-4o-mini-tts
      - key: MAX_AI_CALLS_PER_DAY
        value: 500
